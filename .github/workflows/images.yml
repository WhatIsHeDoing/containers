---
name: Images

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        # Weekly, so base-image fixes land without a code change.
        - cron: "0 5 * * 1"
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # One image so far. A second needs the jobs below to iterate over the Bake targets.
    IMAGE: ghcr.io/whatishedoing/toolchain

jobs:
    build:
        name: Build and test (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write # Pushes each tested image by digest, outside pull requests.
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                      structure-test-sha256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      structure-test-sha256: 801826ed107222120eb6df8c143b7de752cfebbe3aebfeea576e7098486917c2
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build for testing
              uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
              with:
                  source: .
                  load: true
                  set: |
                      *.platform=linux/${{ matrix.arch }}
                      *.no-cache=${{ github.event_name == 'schedule' }}
                      *.cache-from=type=gha,scope=toolchain-${{ matrix.arch }}
                      *.cache-to=type=gha,mode=max,scope=toolchain-${{ matrix.arch }}

            - name: Lint inside the toolchain
              if: matrix.arch == 'amd64'
              run: docker run --rm --volume "$PWD:/workspace" "$IMAGE:dev" just lint-files spellcheck

            - name: Install container-structure-test
              env:
                  ARCH: ${{ matrix.arch }}
                  CHECKSUM: ${{ matrix.structure-test-sha256 }}
              run: |
                  binary="$RUNNER_TEMP/bin/container-structure-test"
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl --fail --silent --show-error --location --max-time 60 --output "$binary" \
                      "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-$ARCH"
                  echo "$CHECKSUM  $binary" | sha256sum --check
                  chmod +x "$binary"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Structure and consumer tests
              run: bash scripts/test.sh

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # No cache-from: the tested build's local layers are the ones to push. Every consumer job pulls
            # these layers, so they take zstd's best ratio rather than gzip's; Docker has pulled zstd since 23.
            - name: Push the tested image by digest
              id: push
              if: github.event_name != 'pull_request'
              uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
              with:
                  source: .
                  provenance: mode=max
                  sbom: true
                  set: |
                      *.platform=linux/${{ matrix.arch }}
                      *.tags=${{ env.IMAGE }}
                      *.output=type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true

            - name: Record the digest
              if: github.event_name != 'pull_request'
              env:
                  METADATA: ${{ steps.push.outputs.metadata }}
              run: |
                  digest=$(jq -r '.toolchain["containerimage.digest"]' <<< "$METADATA")
                  mkdir -p "$RUNNER_TEMP/digests"
                  touch "$RUNNER_TEMP/digests/${digest#sha256:}"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: github.event_name != 'pull_request'
              with:
                  name: digests-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish the multi-arch image
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-24.04
        # The environment only deploys from main, so its Docker Hub secret never reaches other branches.
        environment: release
        permissions:
            contents: read
            id-token: write # cosign signs with the workflow's OIDC identity, not a stored key.
            packages: write # Pushes the index and its tags.
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Join the architectures into one tagged index
              id: index
              run: |
                  description=$(docker buildx bake --print 2>/dev/null |
                      jq -r '.target.toolchain.labels["org.opencontainers.image.description"]')
                  tags=(latest "$(date -u +%Y-%m-%d)" "sha-${GITHUB_SHA::12}")
                  tag_arguments=()
                  for tag in "${tags[@]}"; do
                      tag_arguments+=(--tag "$IMAGE:$tag")
                  done
                  sources=()
                  for digest_file in "$RUNNER_TEMP"/digests/*; do
                      sources+=("$IMAGE@sha256:$(basename "$digest_file")")
                  done
                  docker buildx imagetools create \
                      --annotation "index:org.opencontainers.image.description=$description" \
                      --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                      "${tag_arguments[@]}" \
                      "${sources[@]}"
                  digest=$(docker buildx imagetools inspect "$IMAGE:${tags[2]}" --format '{{json .Manifest}}' |
                      jq -r .digest)
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"

            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Sign the index
              env:
                  DIGEST: ${{ steps.index.outputs.digest }}
              run: cosign sign --yes "$IMAGE@$DIGEST"

            # The mirror stays off until the release environment has a DOCKERHUB_USERNAME variable.
            - name: Log in to Docker Hub
              if: vars.DOCKERHUB_USERNAME != ''
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Mirror the signed index to Docker Hub
              if: vars.DOCKERHUB_USERNAME != ''
              env:
                  DIGEST: ${{ steps.index.outputs.digest }}
                  MIRROR: docker.io/whatishedoing/toolchain
                  TAGS: ${{ steps.index.outputs.tags }}
              run: |
                  read -ra tags <<< "$TAGS"
                  tag_arguments=()
                  for tag in "${tags[@]}"; do
                      tag_arguments+=(--tag "$MIRROR:$tag")
                  done
                  docker buildx imagetools create "${tag_arguments[@]}" "$IMAGE@$DIGEST"
                  cosign sign --yes "$MIRROR@$DIGEST"
