---
config:
    default: true
    line-length:
        line_length: 130
        code_blocks: false
        tables: false
    ul-indent:
        indent: 2
    no-duplicate-heading:
        siblings_only: true
    descriptive-link-text:
        prohibited_texts:
            - "click here"
            - "here"
            - "link"
            - "more"
ignores:
    # A one-line `@AGENTS.md` import, with no heading to give it.
    - CLAUDE.md
    - tmp/**
